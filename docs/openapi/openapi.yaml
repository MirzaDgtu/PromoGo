openapi: 3.0.3
info:
  title: PromoGo API
  version: "1.0"
  description: >
    PromoGo's canonical HTTP API contract: health/readiness, the store-scoped
    1C/POS webhook API (accrual, redemption, client lookup, balance), the
    mobile-customer OTP/session API, and the retailer-staff/platform-admin
    OIDC + RBAC API. Every operation here corresponds 1:1 to a registered
    route in internal/httpserver's route table (see
    internal/httpserver/routes.go) — this parity is enforced by
    TestRouteOpenAPIParity.
  license:
    name: Proprietary
    url: https://github.com/MirzaDgtu/PromoGo
servers:
  - url: /
    description: Relative to wherever the API is deployed; there is no fixed public host.

security:
  - {}

tags:
  - name: Health
    description: Unauthenticated liveness/readiness probes.
  - name: Store
    description: 1C/POS webhook API, authenticated with a per-store API key.
  - name: Customer
    description: Mobile-app customer OTP authentication and profile.
  - name: Staff Auth
    description: Retailer-staff / platform-admin OIDC login.
  - name: Admin - Organizations
    description: Organization and store management.
  - name: Admin - Staff
    description: Staff membership (RBAC) management within an organization.
  - name: Admin - Clients
    description: Admin-facing client lookup and transaction history.
  - name: Admin - Loyalty Config
    description: Per-store loyalty mechanic configuration.
  - name: Admin - API Keys
    description: Store API key issuance and revocation.
  - name: Admin - Audit
    description: Organization audit trail.

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [Health]
      summary: Liveness probe
      description: Always 200 once the process is up; does not check dependencies (see /readyz).
      security: []
      responses:
        "200":
          description: The process is alive.

  /readyz:
    get:
      operationId: getReadyz
      tags: [Health]
      summary: Readiness probe
      description: 200 only once Postgres and Redis are both reachable.
      security: []
      responses:
        "200":
          description: All dependencies are reachable.
        "503":
          description: A dependency (Postgres or Redis) is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/transactions:
    post:
      operationId: createTransaction
      tags: [Store]
      summary: Accrue points for a completed sale (1C webhook)
      description: >
        Idempotent on (store, transaction_id): a retried request with the
        same transaction_id and parameters returns the original result
        (`replayed: true`) rather than crediting points twice. Requires the
        `transactions.write` scope.
      security:
        - storeApiKey: [transactions.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccrueRequest" }
            examples:
              1c-webhook:
                summary: Typical 1C webhook payload
                value:
                  transaction_id: "1C-000123456"
                  phone: "+79261234567"
                  amount: "1250.00"
      responses:
        "200":
          description: Accrual processed (or replayed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionResponse" }
              examples:
                accrued:
                  value: { client_id: 42, points_earned: 125, balance: 640 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/transactions/redeem:
    post:
      operationId: redeemTransaction
      tags: [Store]
      summary: Redeem points at checkout (1C webhook)
      description: >
        Idempotent on (store, transaction_id), like accrual. Requires the
        `transactions.write` scope.
      security:
        - storeApiKey: [transactions.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemRequest" }
      responses:
        "200":
          description: Redemption processed (or replayed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedeemResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: client_id does not belong to this store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Insufficient balance to cover the requested redemption.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/transactions/refund:
    post:
      operationId: refundTransaction
      tags: [Store]
      summary: Partially or fully refund a prior accrual/redeem (1C webhook)
      description: >
        Idempotent on (store, transaction_id), like accrual/redeem.
        original_transaction_id/original_transaction_type identify the
        transaction being reversed; original_transaction_type is only
        required when original_transaction_id was used for both an accrual
        and a redeem under this store. Multiple partial refunds against the
        same original are supported — see refunded_amount_total/
        fully_refunded on the response. Requires the `transactions.write`
        scope.
      security:
        - storeApiKey: [transactions.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRequest" }
            examples:
              partial-refund:
                summary: Partial refund of an accrual
                value:
                  transaction_id: "1C-000123456-R1"
                  original_transaction_id: "1C-000123456"
                  amount: "500.00"
      responses:
        "200":
          description: Refund processed (or replayed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundResponse" }
        "400":
          description: Malformed request, or original_transaction_type required to disambiguate (code "ambiguous_original_transaction"), or the original transaction is itself a refund (code "cannot_refund_refund").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: original_transaction_id does not exist under this store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Refund amount exceeds the original's remaining refundable amount (code "over_refund"), or insufficient balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/clients/resolve-qr:
    post:
      operationId: resolveQR
      tags: [Store]
      summary: Exchange a customer-issued QR payload for a store-scoped client (POS)
      description: >
        Atomically consumes a one-time QR payload minted by POST /me/qr,
        resolving (and creating/linking if this is the client's first visit
        to this store) a store-scoped client. Requires the `clients.lookup`
        scope. See DEC-011.
      security:
        - storeApiKey: [clients.lookup]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveQRRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveQRResponse" }
        "400":
          description: Malformed payload (code "qr_malformed").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/clients/lookup:
    get:
      operationId: lookupClientByPhone
      tags: [Store]
      summary: Look up a client by phone (1C/POS)
      description: >
        Resolves a client_id and current balance for a phone already
        registered under the requesting store. Requires the
        `clients.lookup` scope.
      security:
        - storeApiKey: [clients.lookup]
      parameters:
        - name: phone
          in: query
          required: true
          schema: { type: string }
          example: "+79261234567"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientBalance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/clients/{id}/balance:
    get:
      operationId: getClientBalance
      tags: [Store]
      summary: Get a client's point balance (1C/POS)
      description: 404s if id doesn't belong to the requesting store. Requires the `balances.read` scope.
      security:
        - storeApiKey: [balances.read]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientBalance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/otp/request:
    post:
      operationId: requestOTP
      tags: [Customer]
      summary: Request an OTP code for a phone number
      description: >
        Always 200 with the same body whether or not phone is already
        registered — cannot be used to enumerate accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+79261234567" }
      responses:
        "200":
          description: OTP sent (or would have been).
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: sent } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOTP
      tags: [Customer]
      summary: Verify an OTP code and obtain a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, example: "123456" }
                consent_document_version:
                  type: string
                  description: Required on first registration; omit on a returning login.
                consent_source: { type: string, example: mobile_app }
            examples:
              mobile-verify:
                summary: Mobile app verifying a freshly-requested code
                value: { phone: "+79261234567", code: "123456" }
      responses:
        "200":
          description: Verified — access/refresh token pair issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid or expired code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Account blocked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/refresh:
    post:
      operationId: refreshCustomerSession
      tags: [Customer]
      summary: Rotate a refresh token
      description: Presenting an already-rotated refresh token is treated as compromise — every session for that account is revoked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties: { refresh_token: { type: string } }
      responses:
        "200":
          description: New token pair issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid, expired, or revoked session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/logout:
    post:
      operationId: customerLogout
      tags: [Customer]
      summary: Revoke a single session
      description: Idempotent — an unknown/already-revoked token still returns 204.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties: { refresh_token: { type: string } }
      responses:
        "204": { description: Logged out. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/auth/logout-all:
    post:
      operationId: customerLogoutAll
      tags: [Customer]
      summary: Revoke every session for the caller's account
      security:
        - customerAccessToken: []
      responses:
        "204": { description: All sessions revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me:
    get:
      operationId: getMe
      tags: [Customer]
      summary: Current customer profile
      security:
        - customerAccessToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/balance:
    get:
      operationId: getMyBalance
      tags: [Customer]
      summary: Current customer's point balance, per linked store
      security:
        - customerAccessToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  balances:
                    type: array
                    items: { $ref: "#/components/schemas/MeBalanceItem" }
              examples:
                mobile-balance:
                  value: { balances: [{ store_id: 1, client_id: 42, balance: 640 }] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/me/transactions:
    get:
      operationId: getMyTransactions
      tags: [Customer]
      summary: Current customer's transaction history across all linked stores
      description: Keyset-paginated, newest first.
      security:
        - customerAccessToken: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque continuation token from a previous response's next_cursor.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeTransactionsPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/qr:
    post:
      operationId: issueQR
      tags: [Customer]
      summary: Mint a new one-time QR payload for identification at POS
      description: >
        The payload carries no PII and is one-time-use (see DEC-011).
        Re-issuing before the previous QR's issue cooldown elapses returns
        429 with Retry-After.
      security:
        - customerAccessToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueQRResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/me/devices:
    post:
      operationId: registerDevice
      tags: [Customer]
      summary: Register or refresh an FCM push token for the caller's account
      security:
        - customerAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDeviceRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterDeviceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/me/devices/{deviceID}:
    delete:
      operationId: revokeDevice
      tags: [Customer]
      summary: Revoke one of the caller's own devices
      description: 404s (not 403) if deviceID belongs to a different account, so the response never confirms the ID exists.
      security:
        - customerAccessToken: []
      parameters:
        - name: deviceID
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/staff/auth/oidc:
    post:
      operationId: staffOIDCLogin
      tags: [Staff Auth]
      summary: Exchange a verified OIDC ID token for a PromoGo staff access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties: { id_token: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { access_token: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid ID token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Account disabled or no active organization membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/staff/me:
    get:
      operationId: getStaffMe
      tags: [Staff Auth]
      summary: Get the caller's own staff profile and memberships
      description: >
        Returns the caller's profile plus every active membership and its
        resolved permissions. No organization/store scope applies — this
        describes the caller, not one tenant's resource. An account with no
        active membership still gets 200 with an empty `memberships` array.
      security:
        - staffAccessToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations:
    get:
      operationId: listOrganizations
      tags: [Admin - Organizations]
      summary: List organizations visible to the caller
      description: >
        A platform_admin membership (anywhere) sees every organization;
        any other caller sees only the organizations of their own active
        memberships.
      security:
        - staffAccessToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createOrganization
      tags: [Admin - Organizations]
      summary: Create an Organization
      description: Requires the global `organizations.manage` permission (any organization) — a bootstrap operation.
      security:
        - staffAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, maxLength: 255 } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/stores:
    get:
      operationId: listStores
      tags: [Admin - Organizations]
      summary: List stores visible to the caller within an Organization
      description: >
        A platform_admin, or a caller with an organization-wide membership
        in orgID, sees every store in the organization; a caller with only
        store-scoped membership(s) in orgID sees only those stores. 403 if
        the caller has no membership in orgID at all.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores:
                    type: array
                    items: { $ref: "#/components/schemas/Store" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createStore
      tags: [Admin - Organizations]
      summary: Create a Store within an Organization
      description: Requires `stores.manage` in orgID.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, maxLength: 255 } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/stores/{storeID}:
    get:
      operationId: getStore
      tags: [Admin - Organizations]
      summary: Get a Store
      description: Requires `stores.read`. 404s if storeID doesn't belong to orgID.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/staff:
    get:
      operationId: listStaffMemberships
      tags: [Admin - Staff]
      summary: List staff memberships in an Organization
      description: Requires `staff.manage`.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships:
                    type: array
                    items: { $ref: "#/components/schemas/StaffMembership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createStaffMembership
      tags: [Admin - Staff]
      summary: Grant a staff membership
      description: >
        Requires `staff.manage`. Creates the target StaffUser row (by OIDC
        subject) if it doesn't exist yet — the rest of their profile fills
        in on their first real OIDC login.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_subject, role]
              properties:
                external_subject: { type: string, maxLength: 255 }
                store_id: { type: integer, format: int64, nullable: true }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMembership" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/staff/{membershipID}:
    patch:
      operationId: updateStaffMembership
      tags: [Admin - Staff]
      summary: Update a staff membership's role or status
      description: Requires `staff.manage`.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - name: membershipID
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                status: { $ref: "#/components/schemas/StaffStatus" }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/stores/{storeID}/clients:
    get:
      operationId: adminListClients
      tags: [Admin - Clients]
      summary: List clients in a store, paginated
      description: >
        Requires `clients.read`. Keyset-paginated via `?limit=&cursor=`
        (cursor is the previous page's last client id). Phone is masked
        (e.g. "********4567") for a caller whose only membership in this
        scope is support_viewer. Advanced filters are out of scope for this
        endpoint until the client-list filter/masking UX decision
        (Q-P1-070) is made — this is exact pagination only.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items: { $ref: "#/components/schemas/AdminClient" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/stores/{storeID}/clients/lookup:
    get:
      operationId: adminLookupClient
      tags: [Admin - Clients]
      summary: Look up a client by phone (admin view)
      description: >
        Requires `clients.read`. Phone is masked (e.g. "********4567") for
        a caller whose only membership in this scope is support_viewer.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
        - name: phone
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/stores/{storeID}/clients/{clientID}/transactions:
    get:
      operationId: adminListClientTransactions
      tags: [Admin - Clients]
      summary: List a client's transaction history (admin view)
      description: Requires `transactions.read`. 404s if clientID doesn't belong to storeID.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
        - name: clientID
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items: { $ref: "#/components/schemas/AdminTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/stores/{storeID}/loyalty-config:
    get:
      operationId: getLoyaltyConfig
      tags: [Admin - Loyalty Config]
      summary: Get a store's loyalty configuration
      description: Requires `loyalty_config.read`.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Not configured yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putLoyaltyConfig
      tags: [Admin - Loyalty Config]
      summary: Set a store's loyalty configuration
      description: Requires `loyalty_config.write`.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoyaltyConfig" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/stores/{storeID}/loyalty-config/history:
    get:
      operationId: listLoyaltyConfigHistory
      tags: [Admin - Loyalty Config]
      summary: List a store's loyalty configuration history
      description: >
        Requires `loyalty_config.read`. Newest version first — every prior
        effective configuration, for audit and reconstruction of past
        accrual/redemption calculations.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/LoyaltyConfigVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/stores/{storeID}/loyalty-config/rollback:
    post:
      operationId: rollbackLoyaltyConfig
      tags: [Admin - Loyalty Config]
      summary: Roll back to a prior loyalty configuration version
      description: >
        Requires `loyalty_config.write`. Re-applies a past version's values
        as a new version (forward-only, like git revert) — history is never
        rewritten.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Version not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/stores/{storeID}/api-keys:
    get:
      operationId: listStoreAPIKeys
      tags: [Admin - API Keys]
      summary: List a store's API keys
      description: Requires `api_keys.read`. Never returns the key hash or plaintext.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items: { $ref: "#/components/schemas/StoreAPIKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createStoreAPIKey
      tags: [Admin - API Keys]
      summary: Create a new store API key
      description: >
        Requires `api_keys.rotate`. Returns the plaintext key exactly
        once — it is never persisted or logged again.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 255 }
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/APIKeyScope" }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreAPIKeyCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/stores/{storeID}/api-keys/{keyID}/revoke:
    post:
      operationId: revokeStoreAPIKey
      tags: [Admin - API Keys]
      summary: Revoke a store API key
      description: Requires `api_keys.rotate`.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
        - name: keyID
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/organizations/{orgID}/audit:
    get:
      operationId: listAuditEvents
      tags: [Admin - Audit]
      summary: List recent audit events for an Organization
      description: Requires `audit.read`.
      security:
        - staffAccessToken: []
      parameters:
        - $ref: "#/components/parameters/orgID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  parameters:
    orgID:
      name: orgID
      in: path
      required: true
      schema: { type: integer, format: int64 }
    storeID:
      name: storeID
      in: path
      required: true
      schema: { type: integer, format: int64 }

  headers:
    RetryAfter:
      description: Seconds until the caller may retry.
      schema: { type: integer, minimum: 1 }

  responses:
    BadRequest:
      description: Malformed request body, path, or query parameters.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or expired credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Credential valid but lacks the required scope/permission, or targets a resource outside its tenant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource, or it doesn't belong to the caller's store/organization.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: transaction_id already used with different parameters (idempotency conflict), or a duplicate resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: >
        The referenced one-time resource is expired, already consumed, or
        never existed — deliberately a single response for all three (see
        DEC-011), so the caller can't distinguish them.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: A required backend (e.g. the rate limiter's Redis) is unreachable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Human-readable error message. }
        code:
          type: string
          description: >
            Machine-readable error code, present on a subset of error
            responses that callers may need to branch on programmatically
            (e.g. "daily_redeem_limit_exceeded", "qr_malformed",
            "over_refund"). Absent on errors with no defined code — callers
            must not assume this field is always present.

    AuthTokens:
      type: object
      properties:
        access_token: { type: string }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_token_expires_at: { type: string, format: date-time }
        customer_account_id: { type: integer, format: int64 }

    CustomerProfile:
      type: object
      properties:
        customer_account_id: { type: integer, format: int64 }
        phone: { type: string }
        status: { type: string, enum: [active, blocked, deleted] }
        created_at: { type: string, format: date-time }

    MeBalanceItem:
      type: object
      properties:
        store_id: { type: integer, format: int64 }
        client_id: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }

    MeTransactionItem:
      type: object
      properties:
        store_id: { type: integer, format: int64 }
        store_name: { type: string, description: "Merchant/store label. Empty if the store couldn't be resolved." }
        client_id: { type: integer, format: int64 }
        type: { type: string, enum: [accrual, redeem, refund] }
        amount: { type: string, format: decimal, description: "Purchase amount this transaction is based on." }
        currency: { type: string, example: RUB }
        points_delta: { type: integer, format: int64 }
        balance_after: { type: integer, format: int64 }
        created_at: { type: string, format: date-time, description: Operation date/time. }

    MeTransactionsPage:
      type: object
      properties:
        transactions:
          type: array
          items: { $ref: "#/components/schemas/MeTransactionItem" }
        next_cursor:
          type: string
          description: Opaque; pass back as ?cursor= to fetch the next page. Omitted once history is exhausted.

    AccrueRequest:
      type: object
      required: [transaction_id, phone, amount]
      properties:
        transaction_id:
          type: string
          maxLength: 255
          description: 1C's unique transaction identifier — the idempotency key together with (store, "accrual").
        phone: { type: string, maxLength: 32, example: "+79261234567" }
        amount:
          type: string
          format: decimal
          description: Purchase amount, as a decimal string (not a float, to avoid precision loss).
          example: "1250.00"

    TransactionResponse:
      type: object
      properties:
        client_id: { type: integer, format: int64 }
        points_earned: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        replayed:
          type: boolean
          description: true if transaction_id was already processed and this is the original result, not a new accrual.

    RedeemRequest:
      type: object
      required: [transaction_id, client_id, points, amount]
      properties:
        transaction_id: { type: string, maxLength: 255 }
        client_id: { type: integer, format: int64 }
        points: { type: integer, format: int64, minimum: 1 }
        amount: { type: string, format: decimal, example: "300.00" }

    RedeemResponse:
      type: object
      properties:
        points_redeemed: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        replayed: { type: boolean }

    ClientBalance:
      type: object
      properties:
        client_id: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }

    RefundRequest:
      type: object
      required: [transaction_id, original_transaction_id, amount]
      properties:
        transaction_id:
          type: string
          maxLength: 255
          description: 1C's unique identifier for this refund event — the idempotency key together with (store, "refund").
        original_transaction_id:
          type: string
          maxLength: 255
          description: external_tx_id of the accrual or redeem being reversed.
        original_transaction_type:
          type: string
          enum: [accrual, redeem]
          description: Required only if original_transaction_id was used for both an accrual and a redeem under this store.
        amount:
          type: string
          format: decimal
          description: This refund's amount (may be a partial refund); cumulative refunds against one original may never exceed its original amount.
          example: "500.00"

    RefundResponse:
      type: object
      properties:
        client_id: { type: integer, format: int64 }
        points_reversed: { type: integer, format: int64 }
        balance:
          type: integer
          format: int64
          description: May be negative if this refund reversed an accrual for more points than the client currently holds (DEC-012).
        refunded_amount_total:
          type: string
          format: decimal
          description: Cumulative amount refunded against the original transaction so far, including this refund.
        fully_refunded: { type: boolean }
        replayed: { type: boolean }

    IssueQRResponse:
      type: object
      properties:
        payload:
          type: string
          description: Opaque, versioned, one-time-use token. Contains no PII. The mobile app renders this as a QR image — the backend never generates image data.
        expires_at: { type: string, format: date-time }
        expires_in: { type: integer, description: "Seconds until expiry, at response time." }

    ResolveQRRequest:
      type: object
      required: [payload]
      properties:
        payload: { type: string }

    ResolveQRResponse:
      type: object
      properties:
        client_id: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }

    RegisterDeviceRequest:
      type: object
      required: [platform, push_token]
      properties:
        platform: { type: string, maxLength: 32, example: android }
        push_token: { type: string, maxLength: 4096 }

    RegisterDeviceResponse:
      type: object
      properties:
        device_id: { type: integer, format: int64 }

    Organization:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_at: { type: string, format: date-time }

    Store:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        name: { type: string }

    Role:
      type: string
      enum: [platform_admin, retailer_admin, store_manager, support_viewer]

    StaffStatus:
      type: string
      enum: [active, disabled]

    StaffMembership:
      type: object
      properties:
        id: { type: integer, format: int64 }
        staff_user_id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        store_id: { type: integer, format: int64, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/StaffStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        email:
          type: string
          description: The target StaffUser's profile email. Empty until their first OIDC login.
        display_name:
          type: string
          description: The target StaffUser's profile display name. Empty until their first OIDC login.

    StaffMeMembership:
      type: object
      properties:
        organization_id: { type: integer, format: int64 }
        store_id: { type: integer, format: int64, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          items: { type: string }
          description: The permissions this membership's role grants (domain.RolePermissions), pre-resolved for the frontend.

    StaffMe:
      type: object
      properties:
        staff_user_id: { type: integer, format: int64 }
        email: { type: string }
        display_name: { type: string }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/StaffMeMembership" }

    AdminClient:
      type: object
      properties:
        client_id: { type: integer, format: int64 }
        phone:
          type: string
          description: Masked (e.g. "********4567") if the caller's only membership in this scope is support_viewer.
        balance: { type: integer, format: int64 }

    AdminTransaction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        external_tx_id: { type: string }
        type: { type: string, enum: [accrual, redeem, refund] }
        points_delta: { type: integer, format: int64 }
        balance_after: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    LoyaltyConfig:
      type: object
      required: [mechanic, accrual_percent, min_purchase_amount, min_balance_to_redeem, max_redeem_percent, points_exchange_rate]
      properties:
        store_id: { type: integer, format: int64, readOnly: true }
        mechanic:
          type: string
          example: points
          description: Selects the domain.Mechanic implementation to run on accrual. MVP only wires up "points".
        accrual_percent: { type: string, format: decimal, example: "10", description: "% of purchase amount credited as points." }
        min_purchase_amount: { type: string, format: decimal, example: "0" }
        min_balance_to_redeem: { type: integer, format: int64, example: 0 }
        max_redeem_percent: { type: string, format: decimal, example: "100" }
        points_exchange_rate: { type: string, format: decimal, example: "1" }
        version: { type: integer, format: int64, readOnly: true, description: "Increments on every write. See /loyalty-config/history." }

    LoyaltyConfigVersion:
      type: object
      required: [version, mechanic, accrual_percent, min_purchase_amount, min_balance_to_redeem, max_redeem_percent, points_exchange_rate, created_at]
      properties:
        version: { type: integer, format: int64 }
        mechanic: { type: string, example: points }
        accrual_percent: { type: string, format: decimal, example: "10" }
        min_purchase_amount: { type: string, format: decimal, example: "0" }
        min_balance_to_redeem: { type: integer, format: int64, example: 0 }
        max_redeem_percent: { type: string, format: decimal, example: "100" }
        points_exchange_rate: { type: string, format: decimal, example: "1" }
        changed_by_staff_user_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }

    APIKeyScope:
      type: string
      enum: [transactions.write, clients.lookup, balances.read]

    StoreAPIKey:
      type: object
      properties:
        id: { type: integer, format: int64 }
        key_id:
          type: string
          description: Non-secret, loggable prefix identifying the key — never the secret itself.
        name: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/APIKeyScope" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }

    StoreAPIKeyCreated:
      allOf:
        - $ref: "#/components/schemas/StoreAPIKey"
        - type: object
          properties:
            plaintext_key:
              type: string
              description: The actual API key. Returned exactly once, at creation — never persisted or logged, and never retrievable again.

    AuditEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor_type: { type: string, enum: [customer, staff, store_api_key, system] }
        actor_id: { type: integer, format: int64, nullable: true }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: integer, format: int64, nullable: true }
        metadata: { type: object, additionalProperties: true }
        ip: { type: string }

  securitySchemes:
    storeApiKey:
      type: http
      scheme: bearer
      description: >
        A per-store webhook API key (see Admin - API Keys), scoped to one
        or more of transactions.write / clients.lookup / balances.read. A
        store's legacy single-key credential (predating scopes) is treated
        as implicitly holding every scope.
    customerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived customer access token from /auth/otp/verify or /auth/refresh.
    staffAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived staff access token from /staff/auth/oidc. Every
        operation under /admin also requires a specific RBAC permission —
        see domain.Permission and each operation's description — checked
        against the caller's active StaffMembership rows, resolved fresh on
        every request (never trusted from token claims).
