openapi: 3.0.3
info:
  title: PromoGo — Customer & Staff Auth API
  version: "1.0"
  description: >
    Contracts for the mobile-customer OTP/session API and the staff/
    platform-admin OIDC + RBAC API added in this change. The pre-existing
    1C webhook API (POST /api/v1/transactions, .../redeem,
    GET /api/v1/clients/...) is unchanged and not re-documented here.
servers:
  - url: /api/v1

security: []

paths:
  /auth/otp/request:
    post:
      summary: Request an OTP code for a phone number
      description: >
        Always returns 200 with the same body whether or not phone is
        already a registered CustomerAccount — this endpoint cannot be used
        to enumerate accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+79261234567"
      responses:
        "200":
          description: OTP sent (or would have been, for an existing/unknown phone alike)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: sent
        "400":
          description: Malformed phone number
        "429":
          description: Resend cooldown active or rate limit exceeded

  /auth/otp/verify:
    post:
      summary: Verify an OTP code and obtain a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                code:
                  type: string
                  example: "123456"
                consent_document_version:
                  type: string
                  description: Required on first registration; omit on a returning login.
                consent_source:
                  type: string
                  example: mobile_app
      responses:
        "200":
          description: Verified — access/refresh token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          description: Malformed request
        "401":
          description: Invalid or expired code
        "403":
          description: Account blocked
        "429":
          description: Too many attempts, request a new code

  /auth/refresh:
    post:
      summary: Rotate a refresh token
      description: >
        Presenting an already-rotated refresh token is treated as
        compromise: every session for that account is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid, expired, or revoked session

  /auth/logout:
    post:
      summary: Revoke a single session
      description: Idempotent — an unknown/already-revoked token still returns 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "204":
          description: Logged out

  /auth/logout-all:
    post:
      summary: Revoke every session for the caller's account
      security: [{ customerAccessToken: [] }]
      responses:
        "204":
          description: All sessions revoked
        "401":
          description: Missing/invalid access token

  /me:
    get:
      summary: Current customer profile
      security: [{ customerAccessToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_account_id: { type: integer, format: int64 }
                  phone: { type: string }
                  status: { type: string, enum: [active, blocked, deleted] }
                  created_at: { type: string, format: date-time }

  /me/balance:
    get:
      summary: Current customer's point balance per linked store
      security: [{ customerAccessToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  balances:
                    type: array
                    items:
                      type: object
                      properties:
                        store_id: { type: integer, format: int64 }
                        client_id: { type: integer, format: int64 }
                        balance: { type: integer, format: int64 }

  /me/transactions:
    get:
      summary: Current customer's transaction history across all linked stores
      security: [{ customerAccessToken: [] }]
      responses:
        "200":
          description: OK

  /staff/auth/oidc:
    post:
      summary: Exchange a verified OIDC ID token for a PromoGo staff access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
        "401":
          description: Invalid ID token
        "403":
          description: Account disabled or no active organization membership

  /admin/organizations:
    post:
      summary: Create an Organization
      security: [{ staffAccessToken: [] }]
      description: Requires organizations.manage in any organization (bootstrap operation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created

  /admin/organizations/{orgID}/stores:
    post:
      summary: Create a Store within an Organization
      security: [{ staffAccessToken: [] }]
      description: Requires stores.manage.
      parameters:
        - $ref: "#/components/parameters/orgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created

  /admin/organizations/{orgID}/stores/{storeID}:
    get:
      summary: Get a Store
      security: [{ staffAccessToken: [] }]
      description: Requires stores.read. 404s if storeID doesn't belong to orgID.
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      responses:
        "200": { description: OK }
        "404": { description: Not found }

  /admin/organizations/{orgID}/staff:
    get:
      summary: List staff memberships in an Organization
      security: [{ staffAccessToken: [] }]
      description: Requires staff.manage.
      parameters:
        - $ref: "#/components/parameters/orgID"
      responses:
        "200": { description: OK }
    post:
      summary: Grant a staff membership
      security: [{ staffAccessToken: [] }]
      description: >
        Requires staff.manage. Creates the target StaffUser row (by OIDC
        subject) if it doesn't exist yet — the rest of their profile fills
        in on their first real OIDC login.
      parameters:
        - $ref: "#/components/parameters/orgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_subject, role]
              properties:
                external_subject: { type: string }
                store_id: { type: integer, format: int64, nullable: true }
                role:
                  type: string
                  enum: [platform_admin, retailer_admin, store_manager, support_viewer]
      responses:
        "201": { description: Created }
        "409": { description: Membership already exists }

  /admin/organizations/{orgID}/staff/{membershipID}:
    patch:
      summary: Update a staff membership's role or status
      security: [{ staffAccessToken: [] }]
      description: Requires staff.manage.
      parameters:
        - $ref: "#/components/parameters/orgID"
        - name: membershipID
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [platform_admin, retailer_admin, store_manager, support_viewer]
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        "204": { description: Updated }

  /admin/organizations/{orgID}/stores/{storeID}/clients/lookup:
    get:
      summary: Look up a client by phone (admin view)
      security: [{ staffAccessToken: [] }]
      description: >
        Requires clients.read. Phone is masked (e.g. "********4567") for a
        caller whose only membership in this scope is support_viewer.
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
        - name: phone
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not found }

  /admin/organizations/{orgID}/stores/{storeID}/clients/{clientID}/transactions:
    get:
      summary: List a client's transaction history (admin view)
      security: [{ staffAccessToken: [] }]
      description: Requires transactions.read.
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
        - name: clientID
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: OK }
        "404": { description: Not found }

  /admin/organizations/{orgID}/stores/{storeID}/loyalty-config:
    get:
      summary: Get a store's loyalty configuration
      security: [{ staffAccessToken: [] }]
      description: Requires loyalty_config.read.
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      responses:
        "200": { description: OK }
        "404": { description: Not configured yet }
    put:
      summary: Set a store's loyalty configuration
      security: [{ staffAccessToken: [] }]
      description: Requires loyalty_config.write.
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      responses:
        "200": { description: OK }

  /admin/organizations/{orgID}/stores/{storeID}/api-keys:
    get:
      summary: List a store's API keys
      security: [{ staffAccessToken: [] }]
      description: Requires api_keys.read. Never returns the key hash or plaintext.
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      responses:
        "200": { description: OK }
    post:
      summary: Create a new store API key
      security: [{ staffAccessToken: [] }]
      description: >
        Requires api_keys.rotate. Returns the plaintext key exactly once —
        it is never persisted or logged again.
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [transactions.write, clients.lookup, balances.read]
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "201": { description: Created }

  /admin/organizations/{orgID}/stores/{storeID}/api-keys/{keyID}/revoke:
    post:
      summary: Revoke a store API key
      security: [{ staffAccessToken: [] }]
      description: Requires api_keys.rotate.
      parameters:
        - $ref: "#/components/parameters/orgID"
        - $ref: "#/components/parameters/storeID"
        - name: keyID
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Revoked }

  /admin/organizations/{orgID}/audit:
    get:
      summary: List recent audit events for an Organization
      security: [{ staffAccessToken: [] }]
      description: Requires audit.read.
      parameters:
        - $ref: "#/components/parameters/orgID"
      responses:
        "200": { description: OK }

components:
  parameters:
    orgID:
      name: orgID
      in: path
      required: true
      schema: { type: integer, format: int64 }
    storeID:
      name: storeID
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:
    AuthTokens:
      type: object
      properties:
        access_token: { type: string }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_token_expires_at: { type: string, format: date-time }
        customer_account_id: { type: integer, format: int64 }

  securitySchemes:
    customerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived customer access token from /auth/otp/verify or /auth/refresh.
    staffAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived staff access token from /staff/auth/oidc.
