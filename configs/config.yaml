app:
  name: promogo
  env: development

http:
  host: 0.0.0.0
  port: 8080

postgres:
  host: localhost
  port: 5432
  user: promogo
  password: promogo
  dbname: promogo
  # "disable" is a development-only default. REQUIRED to be "require",
  # "verify-ca", or "verify-full" outside app.env=development —
  # internal/config.Load fails fast otherwise ("prefer"/"allow" don't
  # count: they silently fall back to plaintext if the server doesn't
  # offer TLS).
  sslmode: disable
  max_conns: 10

redis:
  addr: localhost:6379
  password: ""
  db: 0
  # REQUIRED (true) outside app.env=development — internal/config.Load
  # fails fast otherwise. Redis holds OTP challenges, rate-limit counters,
  # and QR one-time tokens.
  tls_enabled: false

logger:
  level: info
  format: json

fcm:
  # Firebase Cloud Messaging service-account key (raw JSON), used to push
  # accrual/redeem/refund notifications to the mobile app. Set via
  # PROMOGO_FCM_CREDENTIALS_JSON — never commit the real key here. Empty =
  # notifications fall back to the log-based channel
  # (internal/notification/logchannel), so the loyalty flow works before
  # push is wired up. REQUIRED outside app.env=development — internal/config.Load
  # fails fast if this is empty outside development (see DEC-014).
  credentials_json: ""

sms:
  # SMS delivery for OTP codes and (optionally) transaction notifications.
  # "log" (internal/notification/logsms) only logs — development/test only.
  # "http" (internal/notification/httpsms) posts to a generic HTTPS SMS
  # gateway (no specific vendor is chosen yet — see
  # .claude/skills/add-notification-channel/SKILL.md); set endpoint/token
  # via PROMOGO_SMS_ENDPOINT / PROMOGO_SMS_TOKEN, never commit the token
  # here. REQUIRED outside app.env=development (provider must be "http"
  # with endpoint/token set) — internal/config.Load fails fast otherwise
  # (see DEC-014).
  provider: log
  endpoint: ""
  token: ""
  sender: PromoGo
  timeout: 5s

auth:
  # HMAC signing secret for both customer and staff access tokens
  # (internal/auth/tokens.go). REQUIRED outside app.env=development — set
  # via PROMOGO_AUTH_ACCESS_TOKEN_SECRET, at least 32 random bytes, never
  # committed here. internal/config.Load fails fast if this is missing/weak
  # outside development.
  access_token_secret: ""
  access_token_ttl: 15m
  refresh_token_ttl: 720h # 30 days
  otp_ttl: 5m
  otp_resend_cooldown: 60s
  otp_max_attempts: 5
  otp_rate_limit_window: 1h
  otp_max_requests_per_phone: 5
  otp_max_requests_per_ip: 20

antifraud:
  # Daily redeem limit (DEC-013): caps the sum of points actually redeemed
  # by a single Client over a rolling window (not calendar days — Store has
  # no timezone yet). 1000/24h is a documented development-only default;
  # REQUIRED (> 0) outside app.env=development — internal/config.Load fails
  # fast otherwise. Set via PROMOGO_ANTIFRAUD_DAILY_REDEEM_POINTS_LIMIT.
  daily_redeem_points_limit: 1000
  daily_redeem_window: 24h
  # QR TTL and cooldowns (DEC-011). Defaults apply in every environment.
  qr_ttl: 2m
  qr_issue_cooldown: 30s
  qr_consume_cooldown: 1s

oidc:
  # Staff/platform-admin OIDC identity provider (internal/auth/oidc.go).
  # Any OIDC-compliant IdP works — Keycloak, Auth0, Azure AD, etc. Empty
  # issuer_url disables staff OIDC login until configured. Typically
  # overridden per environment via PROMOGO_OIDC_ISSUER_URL /
  # PROMOGO_OIDC_AUDIENCE / PROMOGO_OIDC_JWKS_URL rather than hardcoded
  # here, since it usually differs between local/stage/prod.
  issuer_url: ""
  audience: ""
  jwks_url: ""
  jwks_cache_ttl: 10m
