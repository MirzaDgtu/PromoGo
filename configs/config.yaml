app:
  name: promogo
  env: development

http:
  host: 0.0.0.0
  port: 8080

postgres:
  host: localhost
  port: 5432
  user: promogo
  password: promogo
  dbname: promogo
  sslmode: disable
  max_conns: 10

redis:
  addr: localhost:6379
  password: ""
  db: 0

logger:
  level: info
  format: json

fcm:
  # Firebase Cloud Messaging service-account key (raw JSON), used to push
  # "points accrued" notifications to the mobile app. Set via
  # PROMOGO_FCM_CREDENTIALS_JSON — never commit the real key here. Empty =
  # accrual notifications fall back to the log-based channel
  # (internal/notification/logchannel), so the loyalty flow works before
  # push is wired up.
  credentials_json: ""
