name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # internal/httpserver route-level tests must never regress below this.
  # See docs/openapi/openapi.yaml parity test and knowledge/Decisions.md.
  HTTPSERVER_MIN_COVERAGE: "65.0"

jobs:
  verify:
    name: build / vet / fmt / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod verify
        run: go mod verify

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -shuffle=on -count=1 ./...

      - name: internal/httpserver coverage
        run: |
          go test -count=1 -covermode=atomic -coverprofile=httpserver.cover.out ./internal/httpserver/...
          pct="$(go tool cover -func=httpserver.cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')"
          echo "internal/httpserver statement coverage: ${pct}%"
          awk -v pct="$pct" -v min="$HTTPSERVER_MIN_COVERAGE" 'BEGIN { exit !(pct + 0 >= min + 0) }' \
            || { echo "coverage ${pct}% is below required ${HTTPSERVER_MIN_COVERAGE}%"; exit 1; }

      - name: OpenAPI lint (Redocly)
        run: |
          npx --yes @redocly/cli@1.25.5 lint docs/openapi/openapi.yaml

      - name: Route / OpenAPI parity test
        run: go test -count=1 -run TestRouteOpenAPIParity ./internal/httpserver/...

  race:
    name: test -race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C toolchain (race detector requires cgo)
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: go test -race
        run: go test -race -count=1 ./...

  static-analysis:
    name: staticcheck / govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  migrations:
    name: migrate up / down-to-0 / re-up against real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: promogo
          POSTGRES_PASSWORD: promogo
          POSTGRES_DB: promogo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promogo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATIONS_DIR: migrations/sql
      DATABASE_URL: postgres://promogo:promogo@localhost:5432/promogo?sslmode=disable
      GOOSE_VERSION: v3.27.3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: goose validate
        run: go run github.com/pressly/goose/v3/cmd/goose@${{ env.GOOSE_VERSION }} -dir $MIGRATIONS_DIR validate

      - name: migrate up from zero
        run: go run github.com/pressly/goose/v3/cmd/goose@${{ env.GOOSE_VERSION }} -dir $MIGRATIONS_DIR postgres "$DATABASE_URL" up

      - name: migrate down to zero
        run: go run github.com/pressly/goose/v3/cmd/goose@${{ env.GOOSE_VERSION }} -dir $MIGRATIONS_DIR postgres "$DATABASE_URL" down-to 0

      - name: re-apply migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@${{ env.GOOSE_VERSION }} -dir $MIGRATIONS_DIR postgres "$DATABASE_URL" up

  migration-deploy-model:
    name: migrations as a separate deploy step (expand/migrate/contract)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: promogo
          POSTGRES_PASSWORD: promogo
          POSTGRES_DB: promogo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promogo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATIONS_DIR: migrations/sql
      DATABASE_URL: postgres://promogo:promogo@localhost:5432/promogo?sslmode=disable
      GOOSE_VERSION: v3.27.3
      PROMOGO_POSTGRES_HOST: localhost
      PROMOGO_POSTGRES_PORT: "5432"
      PROMOGO_POSTGRES_USER: promogo
      PROMOGO_POSTGRES_PASSWORD: promogo
      PROMOGO_POSTGRES_DBNAME: promogo
      PROMOGO_REDIS_ADDR: localhost:6379
      PROMOGO_APP_SKIP_STARTUP_MIGRATIONS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build promogo
        run: go build -o /tmp/promogo ./cmd/promogo

      # This is the deploy-time step: applies the schema exactly once, out
      # of band, before any replica of the new version starts — the
      # decoupling this job exists to prove (see AppConfig.
      # SkipStartupMigrations and docs/deployment.md).
      - name: promogo migrate (the separate deploy step)
        run: /tmp/promogo migrate

      # A replica started with SkipStartupMigrations=true must never
      # attempt to apply the schema itself — it only verifies the schema
      # migrate already applied is current (internal/migrate.Verify) and
      # serves traffic. Two replicas starting concurrently against an
      # already-migrated schema, both passing /readyz with no migration
      # attempted by either, is the concrete "no re-migration race"
      # guarantee this job checks.
      - name: start two replicas concurrently against the already-migrated schema
        run: |
          PROMOGO_HTTP_PORT=18081 /tmp/promogo > /tmp/replica1.log 2>&1 &
          echo $! > /tmp/replica1.pid
          PROMOGO_HTTP_PORT=18082 /tmp/promogo > /tmp/replica2.log 2>&1 &
          echo $! > /tmp/replica2.pid

          for port in 18081 18082; do
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port/readyz" || true)
              [ "$code" = "200" ] && break
              sleep 0.5
            done
            if [ "$code" != "200" ]; then
              echo "replica on port $port never became ready (last status: $code)"
              echo "--- replica1.log ---"; cat /tmp/replica1.log
              echo "--- replica2.log ---"; cat /tmp/replica2.log
              exit 1
            fi
            echo "replica on port $port: /readyz 200"
          done

          kill "$(cat /tmp/replica1.pid)" "$(cat /tmp/replica2.pid)"

      - name: verify a stale schema fails startup instead of serving silently
        run: |
          go run github.com/pressly/goose/v3/cmd/goose@${{ env.GOOSE_VERSION }} -dir $MIGRATIONS_DIR postgres "$DATABASE_URL" down

          set +e
          PROMOGO_HTTP_PORT=18083 /tmp/promogo > /tmp/stale.log 2>&1
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "expected promogo to fail startup against a schema with a pending migration, but it exited 0"
            cat /tmp/stale.log
            exit 1
          fi
          if ! grep -q "pending migrations exist" /tmp/stale.log; then
            echo "expected the pending-migrations error, got:"
            cat /tmp/stale.log
            exit 1
          fi
          echo "startup correctly refused a stale schema:"
          cat /tmp/stale.log

          # Restore for a clean job (belt-and-suspenders; the service
          # container is discarded with the job regardless).
          go run github.com/pressly/goose/v3/cmd/goose@${{ env.GOOSE_VERSION }} -dir $MIGRATIONS_DIR postgres "$DATABASE_URL" up

  e2e-pilot:
    name: pilot E2E (1C webhook -> accrual -> mobile -> QR -> redeem -> refund)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: promogo
          POSTGRES_PASSWORD: promogo
          POSTGRES_DB: promogo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promogo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROMOGO_POSTGRES_HOST: 127.0.0.1
      PROMOGO_POSTGRES_PORT: "5432"
      PROMOGO_POSTGRES_USER: promogo
      PROMOGO_POSTGRES_PASSWORD: promogo
      PROMOGO_POSTGRES_DBNAME: promogo
      PROMOGO_REDIS_ADDR: 127.0.0.1:6379
      PROMOGO_HTTP_HOST: 127.0.0.1
      PROMOGO_HTTP_PORT: "18098"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -tags e2e (internal/e2e.TestPilotEndToEnd)
        run: go test -tags e2e -run TestPilotEndToEnd -v -count=1 -timeout 90s ./internal/e2e/...

  container:
    name: container build / image scan / SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image
        run: docker build -t promogo:ci -f Dockerfile .

      - name: Scan image for vulnerabilities (Trivy)
        # Pinned by digest, not tag, for the same reason every other CI tool
        # here is pinned: a moved tag must not silently change what the gate
        # checks. Fails the build on an unaccepted HIGH/CRITICAL finding.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignorefile /.trivyignore promogo:ci

      - name: Generate SBOM (Syft, SPDX JSON)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            anchore/syft@sha256:b8c170b8e51bfc4779ec3ef4399942c57290f5ce76a9c3af564c9d00d4946a6b \
            promogo:ci -o spdx-json=/out/promogo-sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promogo-sbom
          path: promogo-sbom.spdx.json
          retention-days: 90

  secret-scan:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /repo --config /repo/.gitleaks.toml --redact -v
