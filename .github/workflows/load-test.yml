name: Load test

# Manual/on-demand, not on every push — a load/soak run costs real minutes
# and this pilot's SLOs (docs/slo.md) don't need re-proving on every commit,
# only when a change plausibly affects request-path performance. Re-run
# after such a change and update docs/load-test-baseline.md.
on:
  workflow_dispatch:
    inputs:
      run_soak:
        description: "Also run the 15-minute soak test"
        type: boolean
        default: false

permissions:
  contents: read

env:
  K6_IMAGE: grafana/k6@sha256:aa8202f377550cee0c8bad295bbe8d2d4d4cf88d15c98383e9ecc53c56882308 # v1.1.0

jobs:
  smoke-and-load:
    name: smoke + load (docs/slo.md thresholds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: promogo
          POSTGRES_PASSWORD: promogo
          POSTGRES_DB: promogo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promogo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROMOGO_POSTGRES_HOST: localhost
      PROMOGO_POSTGRES_PORT: "5432"
      PROMOGO_POSTGRES_USER: promogo
      PROMOGO_POSTGRES_PASSWORD: promogo
      PROMOGO_POSTGRES_DBNAME: promogo
      PROMOGO_REDIS_ADDR: localhost:6379
      PROMOGO_HTTP_PORT: "8080"
      # load.js/soak.js deliberately drive more traffic than one caller's
      # default rate limit allows — see docs/load-testing.md's "Start the
      # app with load-test-scale rate limits" for why.
      PROMOGO_RATELIMIT_ACCRUAL_IP_LIMIT: "6000"
      PROMOGO_RATELIMIT_ACCRUAL_IP_WINDOW: "1m"
      PROMOGO_RATELIMIT_ACCRUAL_PRINCIPAL_LIMIT: "6000"
      PROMOGO_RATELIMIT_ACCRUAL_PRINCIPAL_WINDOW: "1m"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and start promogo
        run: |
          go build -o /tmp/promogo ./cmd/promogo
          /tmp/promogo migrate
          /tmp/promogo > /tmp/promogo.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/readyz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "promogo never became ready"; cat /tmp/promogo.log; exit 1
          fi

      - name: Seed a store/api-key
        run: |
          SEED_JSON=$(/tmp/promogo loadtest-seed)
          echo "$SEED_JSON"
          API_KEY=$(echo "$SEED_JSON" | grep -o '"api_key": *"[^"]*"' | sed 's/.*: *"//;s/"$//')
          echo "API_KEY=$API_KEY" >> "$GITHUB_ENV"

      - name: k6 smoke test
        run: |
          docker run --rm --network host -e BASE_URL=http://localhost:8080 -e API_KEY="$API_KEY" \
            -v "$PWD/loadtest:/loadtest" "$K6_IMAGE" run /loadtest/smoke.js

      - name: k6 load test (asserts docs/slo.md thresholds)
        run: |
          docker run --rm --network host -e BASE_URL=http://localhost:8080 -e API_KEY="$API_KEY" \
            -v "$PWD/loadtest:/loadtest" "$K6_IMAGE" run /loadtest/load.js

      - name: k6 soak test (opt-in)
        if: ${{ inputs.run_soak }}
        run: |
          docker run --rm --network host -e BASE_URL=http://localhost:8080 -e API_KEY="$API_KEY" \
            -v "$PWD/loadtest:/loadtest" "$K6_IMAGE" run /loadtest/soak.js

      - name: promogo logs (always, for debugging a threshold failure)
        if: always()
        run: cat /tmp/promogo.log

  dependency-failure:
    name: dependency-failure (Redis/Postgres outage, fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run dependency-failure test
        run: loadtest/dependency-failure.sh
