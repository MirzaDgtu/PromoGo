name: promogo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: promogo
      POSTGRES_PASSWORD: promogo
      POSTGRES_DB: promogo
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promogo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PROMOGO_POSTGRES_HOST: postgres
      PROMOGO_REDIS_ADDR: redis:6379
      PROMOGO_FCM_CREDENTIALS_JSON: ${PROMOGO_FCM_CREDENTIALS_JSON:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
